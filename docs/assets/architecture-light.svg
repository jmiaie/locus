<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="locus architecture">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker></defs>
<rect x="20" y="30" width="230" height="150" rx="10" fill="none" stroke="#d1d9e0" stroke-width="1.2"/>
<text x="34" y="54" font-size="15" font-weight="700" fill="#1f2328">Your agent / app</text>
<text x="34" y="76" font-size="13" fill="#59636e">Claude Code, Cursor, Codex,</text>
<text x="34" y="95" font-size="13" fill="#59636e">Claude Desktop, scripts</text>
<rect x="20" y="220" width="230" height="150" rx="10" fill="none" stroke="#d1d9e0" stroke-width="1.2"/>
<text x="34" y="244" font-size="15" font-weight="700" fill="#1f2328">Interfaces</text>
<text x="34" y="266" font-size="13" fill="#59636e">MCP stdio: 47 tools, 4 prompts</text>
<text x="34" y="285" font-size="13" fill="#59636e">CLI: locus ...</text>
<text x="34" y="304" font-size="13" fill="#59636e">Python: LocusEngine</text>
<text x="34" y="323" font-size="13" fill="#59636e">HTTP JSON-RPC (token)</text>
<line x1="135" y1="180" x2="135" y2="218" stroke="#59636e" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="300" y="30" width="270" height="150" rx="10" fill="none" stroke="#2f81f7" stroke-width="2"/>
<text x="314" y="54" font-size="15" font-weight="700" fill="#1f2328">Stage 1: BM25 (default)</text>
<text x="314" y="76" font-size="13" fill="#59636e">SQLite FTS5, Porter + stop-words</text>
<text x="314" y="95" font-size="13" fill="#59636e">deterministic, read-only</text>
<text x="314" y="114" font-size="13" fill="#59636e">~2 ms per query</text>
<rect x="620" y="30" width="270" height="150" rx="10" fill="none" stroke="#d1d9e0" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="634" y="54" font-size="15" font-weight="700" fill="#1f2328">Stage 2: optional re-rank</text>
<text x="634" y="76" font-size="13" fill="#59636e">mode="hybrid": KG, link walk,</text>
<text x="634" y="95" font-size="13" fill="#59636e">structure, recency, popularity</text>
<text x="634" y="114" font-size="13" fill="#59636e">fused by weighted RRF</text>
<rect x="620" y="220" width="270" height="150" rx="10" fill="none" stroke="#d1d9e0" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="634" y="244" font-size="15" font-weight="700" fill="#1f2328">Opt-in 1.2 ranking</text>
<text x="634" y="266" font-size="13" fill="#59636e">DenseReranker (locus-rag[dense])</text>
<text x="634" y="285" font-size="13" fill="#59636e">route="advice" (post hoc)</text>
<text x="634" y="304" font-size="13" fill="#59636e">temporal=True date windows</text>
<rect x="940" y="30" width="240" height="150" rx="10" fill="none" stroke="#2f81f7" stroke-width="2"/>
<text x="954" y="54" font-size="15" font-weight="700" fill="#1f2328">Results + provenance</text>
<text x="954" y="76" font-size="13" fill="#59636e">via=bm25 / kg / link / time</text>
<text x="954" y="95" font-size="13" fill="#59636e">explain(): matched terms,</text>
<text x="954" y="114" font-size="13" fill="#59636e">entities, KG facts</text>
<rect x="300" y="220" width="270" height="150" rx="10" fill="none" stroke="#d1d9e0" stroke-width="1.2"/>
<text x="314" y="244" font-size="15" font-weight="700" fill="#1f2328">Memory layer (SQLite)</text>
<text x="314" y="266" font-size="13" fill="#59636e">corpus + chunker, checksum dedup</text>
<text x="314" y="285" font-size="13" fill="#59636e">temporal KG with validity windows</text>
<text x="314" y="304" font-size="13" fill="#59636e">entity aliases, OMPA bridge</text>
<line x1="250" y1="105" x2="298" y2="105" stroke="#59636e" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="570" y1="105" x2="618" y2="105" stroke="#59636e" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="890" y1="105" x2="938" y2="105" stroke="#59636e" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="435" y1="220" x2="435" y2="182" stroke="#59636e" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="755" y1="220" x2="755" y2="182" stroke="#59636e" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="940" y="250" font-size="13" fill="#59636e">No embeddings, GPU or LLM</text>
<text x="940" y="270" font-size="13" fill="#59636e">on the default path.</text>
<text x="940" y="300" font-size="13" fill="#59636e">Dashed = off by default.</text>
</svg>

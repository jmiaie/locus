[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "locus-rag"
version = "0.1.0"
description = "Vectorless RAG with MCP — BM25 + temporal KG + link walking, zero vector dependencies"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ompa = ["ompa>=0.3.0"]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
locus = "locus.__main__:main"

[project.entry-points."mcp.servers"]
locus = "locus.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["locus"]

[tool.pytest.ini_options]
testpaths = ["tests"]

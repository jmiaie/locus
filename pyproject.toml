[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "locus-rag"
version = "0.8.0"
description = "Vectorless RAG with MCP — BM25 + temporal KG + link walking. Zero dependencies."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["rag", "retrieval", "mcp", "knowledge-graph", "bm25", "vectorless", "llm", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage   = "https://github.com/jmiaie/locus"
Repository = "https://github.com/jmiaie/locus"
Changelog  = "https://github.com/jmiaie/locus/blob/main/CHANGELOG.md"
Issues     = "https://github.com/jmiaie/locus/issues"

[project.optional-dependencies]
ompa = ["ompa>=0.3.0"]
dev  = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
locus = "locus.__main__:main"

[project.entry-points."mcp.servers"]
locus = "locus.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["locus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
